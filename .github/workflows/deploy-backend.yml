# Builds the Spring Boot backend and deploys it to an EC2 host as a plain JAR.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST              Public DNS or IP of the EC2 instance
#   EC2_SSH_PRIVATE_KEY   Private key (PEM) for the ec2-user account
#   DB_URL                JDBC URL, e.g. jdbc:postgresql://<rds-endpoint>:5432/gamify_db
#   DB_USERNAME           Database user
#   DB_PASSWORD           Database password
#   JWT_SECRET            256-bit hex key used to sign login tokens (the app won't start without it)
#   MEDIA_S3_BUCKET       Private S3 bucket for post photos and videos, e.g. gamify-media (the app won't start
#                         if it can't reach it)
# Optional:
#   CORS_ALLOWED_ORIGINS  Comma-separated origins allowed to call the API from a browser,
#                         e.g. https://app.example.com (only needed for the Flutter web build)
#   FIREBASE_SERVICE_ACCOUNT  Firebase service account JSON (the whole file); turns on push notifications
#   MEDIA_S3_REGION       The bucket's region, e.g. ap-south-1 (defaults to the EC2 instance's region)
#
# Post media goes to S3, not the instance's disk. Give the instance an IAM role allowing s3:PutObject,
# s3:GetObject and s3:DeleteObject on arn:aws:s3:::<bucket>/posts/*, plus s3:ListBucket on the bucket
# (startup checks it). No AWS keys are needed in secrets. Keep Block Public Access on: the app only
# ever gets short-lived signed links.
#
# The EC2 instance needs Java 17+ installed (Amazon Linux: sudo dnf install -y java-17-amazon-corretto-headless)
# and port 8080 open to clients in its security group.
name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Never run two deploys against the same server at once
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: backend/Gamify
      TARGET_JAR: backend/Gamify/target/Gamify-0.0.1-SNAPSHOT.jar
      EC2_USER: ec2-user
      APP_DIR: /home/ec2-user/gamify-backend
      APP_PORT: '8080'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build backend
        run: |
          cd $PROJECT_PATH
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Prepare SSH key and app settings
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MEDIA_S3_BUCKET: ${{ secrets.MEDIA_S3_BUCKET }}
          MEDIA_S3_REGION: ${{ secrets.MEDIA_S3_REGION }}
        run: |
          echo "$EC2_SSH_PRIVATE_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

          # Fail early with a clear message instead of a backend that won't start
          for name in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET MEDIA_S3_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done

          # %q shell-escapes each value, so passwords with quotes or spaces survive intact
          {
            printf 'export DB_URL=%q\n' "$DB_URL"
            printf 'export DB_USERNAME=%q\n' "$DB_USERNAME"
            printf 'export DB_PASSWORD=%q\n' "$DB_PASSWORD"
            printf 'export JWT_SECRET=%q\n' "$JWT_SECRET"
            printf 'export MEDIA_S3_BUCKET=%q\n' "$MEDIA_S3_BUCKET"
            if [ -n "$MEDIA_S3_REGION" ]; then
              printf 'export MEDIA_S3_REGION=%q\n' "$MEDIA_S3_REGION"
            fi
            if [ -n "$CORS_ALLOWED_ORIGINS" ]; then
              printf 'export CORS_ALLOWED_ORIGINS=%q\n' "$CORS_ALLOWED_ORIGINS"
            fi
            # Multi-line JSON; %q keeps it intact when the file is sourced
            if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
              printf 'export FIREBASE_SERVICE_ACCOUNT=%q\n' "$FIREBASE_SERVICE_ACCOUNT"
            fi
          } > app.env
          chmod 600 app.env

      - name: Upload JAR and settings to EC2
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -i ec2_key.pem"
          ssh $SSH_OPTS $EC2_USER@${{ secrets.EC2_HOST }} "mkdir -p $APP_DIR"

          echo "Uploading JAR to EC2..."
          scp $SSH_OPTS $TARGET_JAR $EC2_USER@${{ secrets.EC2_HOST }}:$APP_DIR/app.jar.new
          scp $SSH_OPTS app.env $EC2_USER@${{ secrets.EC2_HOST }}:$APP_DIR/app.env

      - name: Restart app on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem $EC2_USER@${{ secrets.EC2_HOST }} \
            "bash -s -- '$APP_DIR' '$APP_PORT'" << 'EOF'
          set -e
          APP_DIR="$1"
          APP_PORT="$2"
          cd "$APP_DIR"
          chmod 600 app.env

          if ! command -v java > /dev/null; then
            echo "Java is not installed on this host. Install Java 17+ and re-run the deploy."
            exit 1
          fi

          echo "Stopping old app..."
          pkill -f "java.*$APP_DIR/app.jar" || true
          # Give it up to 30s to shut down cleanly before the new one claims the port
          for i in $(seq 1 30); do
            pgrep -f "java.*$APP_DIR/app.jar" > /dev/null || break
            sleep 1
          done
          pkill -9 -f "java.*$APP_DIR/app.jar" || true

          if command -v lsof > /dev/null; then
            PID=$(lsof -t -i:"$APP_PORT" || true)
            if [ -n "$PID" ]; then
              echo "Killing PID $PID still holding port $APP_PORT..."
              kill -9 $PID
            fi
          fi

          echo "Swapping in the new JAR (previous one kept as app.jar.prev)..."
          if [ -f app.jar ]; then mv app.jar app.jar.prev; fi
          mv app.jar.new app.jar

          echo "Starting new app..."
          set -a; . ./app.env; set +a
          nohup java -jar "$APP_DIR/app.jar" --server.port="$APP_PORT" > "$APP_DIR/app.log" 2>&1 &

          # Any HTTP status at all means the API is up and answering
          echo "Waiting for the API to respond..."
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APP_PORT/api/v1/players/search" || true)
            if [ "$CODE" != "000" ]; then
              echo "App started (HTTP $CODE after ${i}s)."
              exit 0
            fi
            sleep 1
          done

          echo "App did not respond within 60s. Last log lines:"
          tail -n 60 "$APP_DIR/app.log"
          exit 1
          EOF

      - name: Remove SSH key and settings from runner
        if: always()
        run: rm -f ec2_key.pem app.env
