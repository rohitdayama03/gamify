spring.application.name=Gamify

# ===================================================================
# Server Configuration
# ===================================================================
server.port=8080

# ===================================================================
# PostgreSQL Database Connection Settings
# ===================================================================
# Set DB_URL on servers (e.g. an RDS endpoint); local runs fall back to localhost
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gamify_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP defaults)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# Schema DDL options: create, create-drop, update, validate, none
# Use 'update' for development, 'validate' or Flyway/Liquibase for production
spring.jpa.hibernate.ddl-auto=update

# Database Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Logging & Formatting
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Snake_case Naming Strategy (e.g., bgmiId -> bgmi_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ===================================================================
# Application JWT Security Settings
# ===================================================================
# 256-bit Hex-Encoded Secret Key
app.jwt.secret=${JWT_SECRET}
# Token Expiration in Milliseconds (86400000 ms = 24 Hours)
app.jwt.expiration-ms=86400000

# ===================================================================
# CORS
# ===================================================================
# Comma-separated origin patterns allowed to call the API from a browser (the Flutter web build).
# Mobile apps don't need this. On a server, set e.g. CORS_ALLOWED_ORIGINS=https://app.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ===================================================================
# Gaming news (headlines + links from public RSS feeds)
# ===================================================================
# Sources are pulled in parallel each day; each takes up to its daily-limit of new stories, rotating
# across its feeds. A feed's "game" tags all its stories; otherwise titles are matched by keyword.
app.news.sources[0].name=IGN India
app.news.sources[0].daily-limit=50
app.news.sources[0].feeds[0].url=https://in.ign.com/feed.xml
app.news.sources[0].feeds[1].url=https://in.ign.com/news.xml
# Google News searches, limited to the last 2 days (without "when:" they return years-old articles)
app.news.sources[1].name=Google News
app.news.sources[1].daily-limit=50
app.news.sources[1].feeds[0].url=https://news.google.com/rss/search?q=BGMI+when:2d&hl=en-IN&gl=IN&ceid=IN:en
app.news.sources[1].feeds[0].game=BGMI
app.news.sources[1].feeds[1].url=https://news.google.com/rss/search?q=eFootball+when:2d&hl=en-IN&gl=IN&ceid=IN:en
app.news.sources[1].feeds[1].game=EFOOTBALL
app.news.sources[1].feeds[2].url=https://news.google.com/rss/search?q=%22GTA+Online%22+OR+%22GTA+6%22+when:2d&hl=en-IN&gl=IN&ceid=IN:en
app.news.sources[1].feeds[2].game=GTA
# Official YouTube channels (videos with thumbnails). Dedicated channels keep every video; Rockstar
# posts several games, so only videos whose title names GTA are kept.
app.news.sources[2].name=YouTube
app.news.sources[2].daily-limit=15
# KRAFTON INDIA ESPORTS (official BGMI esports channel)
app.news.sources[2].feeds[0].url=https://www.youtube.com/feeds/videos.xml?channel_id=UCugG6-k5QGbq_iDEPAnG4NQ
app.news.sources[2].feeds[0].game=BGMI
app.news.sources[2].feeds[0].match-title=false
# eFootball (official global channel, linked from konami.com)
app.news.sources[2].feeds[1].url=https://www.youtube.com/feeds/videos.xml?channel_id=UCQdSC4folRoUuPC3iiRkfFQ
app.news.sources[2].feeds[1].game=EFOOTBALL
app.news.sources[2].feeds[1].match-title=false
# Rockstar Games
app.news.sources[2].feeds[2].url=https://www.youtube.com/feeds/videos.xml?channel_id=UC6VcWc1rAoWdBCM0JxrRQ3A
app.news.sources[2].feeds[2].game=GTA
# Every day at 06:00 India time (sec min hour day month weekday)
app.news.cron=0 0 6 * * *
app.news.zone=Asia/Kolkata
app.news.retention-days=30

# ===================================================================
# Push notifications (Firebase Cloud Messaging)
# ===================================================================
# Set one of these to turn pushes on; without them the app works but sends no notifications.
#   FIREBASE_SERVICE_ACCOUNT       the service account JSON itself (the server, via GitHub secret)
#   FIREBASE_SERVICE_ACCOUNT_FILE  path to the JSON file (local development)
app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:}
app.firebase.service-account-file=${FIREBASE_SERVICE_ACCOUNT_FILE:}
